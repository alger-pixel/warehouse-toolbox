<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browser-based utilities for warehouse operations.">
  <title>MKITE Warehouse Tools</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tools/matching.css">
  <link rel="stylesheet" href="css/tools/sorting.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="sidebar-header">
        <button class="brand" type="button" data-route="dashboard" aria-label="Open dashboard">
          <img class="brand-logo" src="assets/images/mkite-logo.png" alt="MKITE International">
          <span class="brand-fallback" aria-hidden="true">MKITE</span>
        </button>
        <button class="icon-button collapse-button" id="collapse-button" type="button" aria-label="Collapse sidebar" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      </div>
      <nav class="sidebar-nav" aria-label="Application navigation">
        <button class="nav-item is-active" type="button" data-route="dashboard" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></button>
        <button class="nav-item" type="button" data-route="tools"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="18" cy="17" r="2"/></svg><span>Tools</span></button>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" type="button" data-route="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg><span>Settings</span></button>
        <div class="version"><span>UI Foundation</span><small>v0.2</small></div>
      </div>
    </aside>
    <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Close navigation"></button>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
          <div><span class="eyebrow">Warehouse Tools</span><h1 id="section-title">Dashboard</h1></div>
        </div>
        <div class="topbar-actions">
          <button class="topbar-search" id="topbar-search" type="button" aria-label="Search tools"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Search tools</span><kbd>/</kbd></button>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to light mode">
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8 8 0 0 1 8.5 4 8 8 0 1 0 20 15.5Z"/></svg>
          </button>
        </div>
      </header>
      <main class="main-content" id="main-content" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="js/storage.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/tools-registry.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="js/tools/matching.js"></script>
  <script src="js/tools/sorting.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
