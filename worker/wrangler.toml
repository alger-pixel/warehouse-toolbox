name = "mkite-secure-api"
main = "src/index.js"
compatibility_date = "2026-09-03"

# Configure production values with Worker environment/secrets. Do not place
# FEISHU_APP_SECRET or other credentials in this file.
[vars]
FEISHU_PROJECT_TABLE_ID = "tbldVnRmtOLM1Jzw" # PROJECT CLASS
FEISHU_CASE_CATEGORY_TABLE_ID = "tblwFyckkj7CxLnt" # CASE CATEGORY
FEISHU_CASE_CLASS_TABLE_ID = "tbluJiLs4arOJgt6" # CASE CLASS
# Required for User Management only. Set the actual existing USER CLASS ID.
FEISHU_USER_TABLE_ID = ""
FEISHU_TINECO_TOC_UNIT_TABLE_ID = "tblztQK3EhDAw2Wm"
FEISHU_TOOL_TABLE_ID = "tblNxCev7LS7uETW" # TOOL CLASS
FEISHU_SAFETY_ICON_TABLE_ID = "tblwUpkyUg7zJH2Z"
FEISHU_SOP_TABLE_ID = "tblbjuzqgqyp6pY2"
FEISHU_PART_USED_TABLE_ID = "tblH3rKpAr13NTC9"
FEISHU_PART_USED_INVENTORY_COUNT_TABLE_ID = "tblNme2hwztNOlte"
ALLOWED_ORIGINS = "https://alger-pixel.github.io,http://127.0.0.1:5501,http://localhost:5501"
FEISHU_CLIENT_TABLE_ID = "tblQGCq6Y404LLJB"
FEISHU_PICKING_LIST_TABLE_ID = "tblRfLgo1jIQkzmi"
WAREHOUSE_TIME_ZONE = "America/Toronto"
OPENAI_COMMAND_MODEL = "gpt-5.6-luna"
OPENAI_COMMAND_DIAGNOSTICS = "true"
[[durable_objects.bindings]]
name = "B044_PUT_AWAY"
class_name = "B044PutAwayCoordinator"

[[migrations]]
tag = "b044-picking-v1"
new_sqlite_classes = ["B044PutAwayCoordinator"]

[[durable_objects.bindings]]
name = "TINECO_TOC"
class_name = "TinecoTocCoordinator"

[[migrations]]
tag = "tineco-toc-v1"
new_sqlite_classes = ["TinecoTocCoordinator"]

[[durable_objects.bindings]]
name = "USER_MANAGEMENT"
class_name = "UserManagementCoordinator"

[[migrations]]
tag = "user-management-v1"
new_sqlite_classes = ["UserManagementCoordinator"]

[[durable_objects.bindings]]
name = "SOP_PROJECTS"
class_name = "SopProjectCoordinator"

[[migrations]]
tag = "sop-projects-v1"
new_sqlite_classes = ["SopProjectCoordinator"]

[[durable_objects.bindings]]
name = "PART_USED"
class_name = "PartUsedCoordinator"

[[migrations]]
tag = "part-used-v1"
new_sqlite_classes = ["PartUsedCoordinator"]

[[durable_objects.bindings]]
name = "PROJECTS"
class_name = "ProjectCoordinator"

[[migrations]]
tag = "projects-v1"
new_sqlite_classes = ["ProjectCoordinator"]

[[durable_objects.bindings]]
name = "CASE_CATEGORIES"
class_name = "CaseCategoryCoordinator"

[[migrations]]
tag = "case-categories-v1"
new_sqlite_classes = ["CaseCategoryCoordinator"]

[[durable_objects.bindings]]
name = "CASES"
class_name = "CaseCoordinator"

[[migrations]]
tag = "cases-v1"
new_sqlite_classes = ["CaseCoordinator"]
